name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        uses: huggingface/hub-sync@v0.2.1
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: "Chou1210/pacific-parrotlet-behavior-detector"
          repo_type: "space"
          hf_token: ${{ secrets.HF_TOKEN }}
